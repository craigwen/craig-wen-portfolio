<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Mastercard</title>
  <defs>
    <clipPath id="mcOverlap">
      <circle cx="7.416" cy="12" r="7.416" />
    </clipPath>
  </defs>
  <circle cx="7.416" cy="12" r="7.416" fill="#EB001B" />
  <circle cx="16.584" cy="12" r="7.416" fill="#F79E1B" />
  <!-- The lens where the two circles meet, drawn by clipping the right
       circle against the left one. -->
  <circle
    cx="16.584"
    cy="12"
    r="7.416"
    fill="#FF5F00"
    clip-path="url(#mcOverlap)"
  />
</svg>
