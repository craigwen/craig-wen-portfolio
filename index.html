<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craig Wen</title>
<meta name="description" content="Craig Wen, Content Designer. Portfolio coming soon.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050a05;
    --fg: #7dff9a;
    --dim: #3f9a55;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'VT323', 'Courier New', monospace;
    font-size: clamp(1.25rem, 2.6vw, 1.75rem);
    line-height: 1.35;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-inline: 16px;
    text-shadow: 0 0 6px rgba(125, 255, 154, 0.35);
  }

  main {
    width: min(100%, 38ch);
    min-width: 0;
    display: grid;
    gap: 1.1em;
  }

  .status {
    display: flex;
    justify-content: space-between;
    gap: 1ch;
    background: var(--fg);
    color: var(--bg);
    padding-inline: 1ch;
    text-shadow: none;
  }

  .cmd { color: var(--dim); }

  main p { overflow-wrap: break-word; }

  h1 {
    font-size: inherit;
    font-weight: normal;
    text-transform: uppercase;
  }

  a {
    color: var(--fg);
    text-decoration: underline;
    text-underline-offset: 0.2em;
  }
  a:hover, a:focus-visible {
    background: var(--fg);
    color: var(--bg);
    text-decoration: none;
    text-shadow: none;
    outline: none;
  }

  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1em;
    background: var(--fg);
    vertical-align: -0.15em;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>
<body>

<main>
  <div class="status" aria-hidden="true">
    <span>Craig Wen</span>
    <span>Moves: 1</span>
  </div>

  <p class="cmd">&gt; LOOK</p>

  <div>
    <h1>Portfolio, Under Renovation</h1>
    <p>I'm giving my portfolio a much needed overhaul. For now, find me on <a href="https://www.linkedin.com/in/craig-wen/">LinkedIn</a>.</p>
  </div>

  <p aria-hidden="true">&gt; <span class="cursor"></span></p>
</main>

</body>
</html>
