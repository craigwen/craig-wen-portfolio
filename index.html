<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craig Wen</title>
<meta name="description" content="Craig Wen — Content Designer. Portfolio coming soon.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0820;
    color: #fef0d9;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .page-text {
    padding: 3.5rem 2rem 3rem;
    max-width: 44rem;
    flex-shrink: 0;
  }

  .badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.55rem;
    color: #ff7733;
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 2rem;
  }

  .headline {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(0.7rem, 1.8vw, 0.95rem);
    line-height: 2;
    color: #fef0d9;
    margin-bottom: 1.5rem;
  }

  .headline a {
    color: #ff7733;
    text-decoration: none;
  }

  .headline a:hover {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .spacer { flex: 1; }

  #scene {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>

<div class="page-text">
  <span class="badge">SITE UNDER CONSTRUCTION</span>
  <p class="headline">I'm overhauling my portfolio.<br>Till then, find me on <a href="https://www.linkedin.com/in/craig-wen/">LinkedIn</a></p>
</div>

<div class="spacer"></div>

<canvas id="scene" aria-label="Pixel art scene: a construction site at sunset, with traffic cones, a sawhorse barrier, and a road"></canvas>

<script>
(function () {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  const GW = 96, GH = 40;
  canvas.width = GW;
  canvas.height = GH;

  function px(x, y, c, w, h) {
    w = (w === undefined) ? 1 : w;
    h = (h === undefined) ? 1 : h;
    if (x >= GW || y >= GH || x + w <= 0 || y + h <= 0) return;
    ctx.fillStyle = c;
    ctx.fillRect(x, y, Math.min(w, GW - x), Math.min(h, GH - y));
  }

  function lerpColor(c0, c1, t) {
    function hex(s) { return [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)]; }
    const [r0,g0,b0] = hex(c0), [r1,g1,b1] = hex(c1);
    return 'rgb('+~~(r0+(r1-r0)*t)+','+~~(g0+(g1-g0)*t)+','+~~(b0+(b1-b0)*t)+')';
  }

  const skyStops = [
    [0,  '#0d0820'],
    [7,  '#1a1040'],
    [13, '#3a1250'],
    [18, '#6a1f45'],
    [22, '#9b3030'],
    [26, '#d05025'],
    [29, '#ff7733'],
  ];

  function skyAt(row) {
    for (let i = 0; i < skyStops.length - 1; i++) {
      const [r0, c0] = skyStops[i], [r1, c1] = skyStops[i + 1];
      if (row >= r0 && row < r1) return lerpColor(c0, c1, (row - r0) / (r1 - r0));
    }
    return skyStops[skyStops.length - 1][1];
  }

  // Sky
  for (let y = 0; y < 30; y++) px(0, y, skyAt(y), GW);

  // Ground (warm dark asphalt, lighter at horizon, darker in foreground)
  const groundPalette = ['#3d2010','#2d1508','#2d1508','#251205','#221004','#1e0d04','#1a0d05','#170b03','#140903','#120802'];
  for (let y = 30; y < GH; y++) px(0, y, groundPalette[y - 30] || '#120802', GW);

  // === STARS ===
  [
    [3,2],[9,4],[14,1],[16,2],[24,1],[32,4],[41,2],[50,1],[58,3],[66,2],[74,4],[83,1],[93,3],
    [2,8],[7,6],[12,10],[17,7],[25,6],[33,9],[40,8],[48,10],[56,8],[63,11],[71,9],[80,7],[88,8],
    [4,14],[10,12],[15,16],[20,14],[28,12],[37,15],[45,13],[53,16],[61,13],[70,16],[78,14],[87,11],[94,13],
    [1,20],[8,22],[13,19],[19,21],[27,19],[35,22],[44,20],[52,23],[61,21],[69,19],[78,22],[86,20]
  ].forEach(function(s) { px(s[0], s[1], '#e0d0f8'); });

  // Brighter accent stars
  [[9,4],[32,4],[50,1],[56,8],[44,20]].forEach(function(s) { px(s[0], s[1], '#ffffff'); });

  // === MOON (full) ===
  px(90, 1, '#fff4b0', 3, 3);

  // === BARRIER ===
  // Top rail
  px(22, 22, '#8b6040', 52, 1);
  // Diagonal stripe panel (rows 23–27)
  for (var bx = 22; bx < 74; bx++) {
    for (var by = 23; by <= 27; by++) {
      var stripe = Math.floor((bx + by) / 5) % 2;
      px(bx, by, stripe === 0 ? '#ffe066' : '#1a0d05');
    }
  }
  // Bottom rail
  px(22, 28, '#8b6040', 52, 1);
  // Left leg + foot
  px(25, 29, '#8b6040', 2, 4);
  px(23, 32, '#8b6040', 6, 1);
  // Center leg
  px(46, 29, '#8b6040', 2, 3);
  // Right leg + foot
  px(68, 29, '#8b6040', 2, 4);
  px(66, 32, '#8b6040', 6, 1);

  // === TRAFFIC CONES ===
  function drawCone(cx, cy) {
    px(cx+4, cy,   '#ffaa77', 1);
    px(cx+3, cy+1, '#ffaa77', 1);
    px(cx+4, cy+1, '#ff7733', 1);
    px(cx+5, cy+1, '#cc5520', 1);
    px(cx+2, cy+2, '#ffe8d8', 5);
    px(cx+1, cy+3, '#ffaa77', 1);
    px(cx+2, cy+3, '#ff7733', 5);
    px(cx+7, cy+3, '#cc5520', 1);
    px(cx+1, cy+4, '#ffe8d8', 7);
    px(cx,   cy+5, '#ffaa77', 1);
    px(cx+1, cy+5, '#ff7733', 7);
    px(cx+8, cy+5, '#cc5520', 1);
    px(cx-1, cy+6, '#5a3015', 11, 2);
  }

  drawCone(14, 24);
  drawCone(78, 24);

  // === ROAD DASHES ===
  for (var dx = 0; dx < GW; dx += 9) {
    px(dx, 31, '#4a2e10', 5, 1);
  }

})();
</script>

</body>
</html>
