<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craig Wen</title>
<meta name="description" content="Craig Wen — Content Designer. Portfolio coming soon.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0820;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    -webkit-font-smoothing: antialiased;
  }

  .canvas-wrap {
    position: relative;
    flex-shrink: 0;
  }

  #scene {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #bubble {
    position: absolute;
    left: 5%;
    bottom: 87%;
    max-width: 60%;
    background: #fef0d9;
    border: 3px solid #1a0d05;
    padding: 0.6em 0.9em;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(0.45rem, 1.1vw, 0.7rem);
    line-height: 2.2;
    color: #1a0d05;
  }

  #bubble::after {
    content: '';
    position: absolute;
    bottom: -14px; left: 14px;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 14px solid #1a0d05;
  }

  #bubble::before {
    content: '';
    position: absolute;
    bottom: -9px; left: 17px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 9px solid #fef0d9;
    z-index: 1;
  }

  #bubble a { color: #ff7733; text-decoration: none; }
  #bubble a:hover { text-decoration: underline; text-underline-offset: 3px; }

  @media (max-width: 600px) {
    body { justify-content: center; }
  }
</style>
</head>
<body>

<div class="canvas-wrap">
  <canvas id="scene" aria-label="Pixel art scene: a construction site at sunset, with a pixel character, traffic cones, a sawhorse barrier, and a road"></canvas>
  <div id="bubble" hidden>
    <p id="dialogue"></p>
  </div>
</div>

<script>
(function () {
  var canvas   = document.getElementById('scene');
  var ctx      = canvas.getContext('2d');
  var bubble   = document.getElementById('bubble');
  var dialogue = document.getElementById('dialogue');

  var GW = 192, GH = 96;
  canvas.width  = GW;
  canvas.height = GH;

  function px(x, y, c, w, h) {
    w = w === undefined ? 1 : w;
    h = h === undefined ? 1 : h;
    if (x >= GW || y >= GH || x + w <= 0 || y + h <= 0) return;
    ctx.fillStyle = c;
    ctx.fillRect(x, y, Math.min(w, GW - x), Math.min(h, GH - y));
  }

  function lerpColor(c0, c1, t) {
    function hex(s) { return [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)]; }
    var a = hex(c0), b = hex(c1);
    return 'rgb('+~~(a[0]+(b[0]-a[0])*t)+','+~~(a[1]+(b[1]-a[1])*t)+','+~~(a[2]+(b[2]-a[2])*t)+')';
  }

  var skyStops = [
    [0,  '#0d0820'],
    [14, '#1a1040'],
    [26, '#3a1250'],
    [36, '#6a1f45'],
    [44, '#9b3030'],
    [52, '#d05025'],
    [58, '#ff7733'],
  ];

  function skyAt(row) {
    for (var i = 0; i < skyStops.length - 1; i++) {
      var r0 = skyStops[i][0], c0 = skyStops[i][1];
      var r1 = skyStops[i+1][0], c1 = skyStops[i+1][1];
      if (row >= r0 && row < r1) return lerpColor(c0, c1, (row - r0) / (r1 - r0));
    }
    return skyStops[skyStops.length - 1][1];
  }

  function drawCone(cx, cy) {
    px(cx+6,  cy,    '#ffaa77', 2, 2);
    px(cx+6,  cy+2,  '#ff9966', 2, 2);
    px(cx+4,  cy+4,  '#ffe8d8', 6, 2);
    px(cx+2,  cy+6,  '#ffaa77', 2, 2); px(cx+4,  cy+6,  '#ff7733', 6, 2); px(cx+10, cy+6,  '#cc5520', 2, 2);
    px(cx+2,  cy+8,  '#ffaa77', 2, 2); px(cx+4,  cy+8,  '#ff7733', 6, 2); px(cx+10, cy+8,  '#cc5520', 2, 2);
    px(cx+2,  cy+10, '#ffe8d8', 10, 2);
    px(cx,    cy+12, '#ffaa77', 2, 2); px(cx+2,  cy+12, '#ff7733', 10, 2); px(cx+12, cy+12, '#cc5520', 2, 2);
    px(cx,    cy+14, '#ffaa77', 2, 2); px(cx+2,  cy+14, '#ff7733', 10, 2); px(cx+12, cy+14, '#cc5520', 2, 2);
    px(cx,    cy+16, '#ffe8d8', 14, 2);
    px(cx,    cy+18, '#ffaa77', 2, 2); px(cx+2,  cy+18, '#ff7733', 10, 2); px(cx+12, cy+18, '#cc5520', 2, 2);
    px(cx-2,  cy+20, '#5a3015', 18, 4);
  }

  function drawBackground() {
    // Sky
    for (var y = 0; y < 60; y++) px(0, y, skyAt(y), GW);

    // Ground
    var ground = ['#3d2010','#3d2010','#2d1508','#2d1508','#2d1508','#2d1508','#251205','#251205','#221004','#221004','#1e0d04','#1e0d04','#1a0d05','#1a0d05','#170b03','#170b03','#140903','#140903','#120802','#120802'];
    for (var yg = 60; yg < GH; yg++) px(0, yg, ground[yg - 60] || '#120802', GW);

    // Stars
    [
      [6,4],[18,8],[28,2],[32,4],[48,2],[64,8],[82,4],[100,2],[116,6],[132,4],[148,8],[166,2],[186,6],
      [4,16],[14,12],[24,20],[34,14],[50,12],[66,18],[80,16],[96,20],[112,16],[126,22],[142,18],[160,14],[176,16],
      [8,28],[20,24],[30,32],[40,28],[56,24],[74,30],[90,26],[106,32],[122,26],[140,32],[156,28],[174,22],[188,26],
      [2,40],[16,44],[26,38],[38,42],[54,38],[70,44],[88,40],[104,46],[122,42],[138,38],[156,44],[172,40]
    ].forEach(function(s) { px(s[0], s[1], '#e0d0f8', 2, 2); });
    [[18,8],[64,8],[100,2],[112,16],[88,40]].forEach(function(s) { px(s[0], s[1], '#ffffff', 2, 2); });

    // Moon
    px(180, 2, '#fff4b0', 6, 6);

    // Barrier
    px(44, 44, '#8b6040', 104, 2);
    for (var bx = 44; bx < 148; bx++) {
      for (var by = 46; by <= 54; by++) {
        px(bx, by, Math.floor((bx + by) / 10) % 2 === 0 ? '#ffe066' : '#1a0d05');
      }
    }
    px(44, 56, '#8b6040', 104, 2);
    px(50, 58, '#8b6040', 4, 8);
    px(46, 64, '#8b6040', 12, 2);
    px(92, 58, '#8b6040', 4, 6);
    px(136, 58, '#8b6040', 4, 8);
    px(132, 64, '#8b6040', 12, 2);

    // Cones
    drawCone(38, 40);
    drawCone(156, 40);

    // Road dashes
    for (var dx = 0; dx < GW; dx += 18) px(dx, 62, '#4a2e10', 10, 2);
  }

  // === SPRITE ===
  var _spr = new Image();
  _spr.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEgAAABACAYAAAC5vjEqAAAISUlEQVR42u2ba1BU5xnHD8pFFpbLLvfL3m8se+MSiEaT2DFtMCkkavBCNHJH0MiiNDZViVWToSqYNuVmrFIU0BYFNE7S5EOtIiYZL7HS1jpqdTr92MxkOjGTxPn3Oe+itdOznYn78oE5+8ycOYdl+D277///PO9zdllBCAa/mDEzFFEKBegSQf5DcfPmDSgIHB4eDrVajdCwUNTU1CDInwyLycJWvXtdKQrtRnYdHh6BIJ+ivKICM2aEAFeGcPfcIXw11od7dJ5f6EaQ7wtYLTac79uFu2d78eWZXnw7fgjX39+HIH8ygVZvQm6W8X5zQ9Mri9k5Pz8fsufvaa6gphaOq621ePsX7yCE7DrHaWIJRkdHIXe+cLtnEyJmReLLscMM+kSuHfjsN5i/4PtcLDrd+cJdqldcGsI3nx7F3bFf4x/Du7H9xUJ8e+0UgvzJUCsVtAscx8X2BvzrTB+++EMv7t36AEH+Q43ui9MHcO+TAdQt+QEaSouwueIFBPkPxc+rnyebDuKr84fx9ceDWPbyKgT5k3H58iXcOrAFRblWfH78Z/jncBvXJz+t+Xl5uVBEx1Cfexv9VQvw0cZFXJ/8tObrjWZk6IzQmaww6C34bfuP8TnZ05GdDdnzMzL1UMbGM7hGb4beYEFiUirS0jUwmLPgcHrQ19cHWfLb29ugN1qRSSO63mSjUd0MndHCzuygaxPdIc978mnIkc+2RR2teCbB0jO10JIKLBGBdZTYQIf4+3iVGjLlC2RLE1JS0pCckorqunqMnRtHWEQUTr53EhZbNrZt34GIiFmYmJiA7PiJyanQaI2Ii1Ox+5eyla/gxs0bGBs7w2C379xm5/CISBQWFkJufEGdlMIam5ZsmK7R49mFxQySl1/Azh/+7kOMnx+HMib2kRJMd74g1qlWZ4JGZ0YiWXRwYICsmslqN06VhMTkdMQnpBA4BCajCXLj+xKITY5smkB2jSGrik1N3AE0lDg9Q8euQ0JCYM+yQW58QaGMYw1OrzNAmBEC3aRd72+TYrK0DC2rb4cjB7Lib9zYBL3ZhgyqXRGgSkxCSlqGLwmtvtZgfjB8KaKiYLXZISe+4PU2Il6dyAat+9tlcmoGjDR9aieTiAqkkAIKhZjAATnxhTVr6mAw+WApBI6IjGTJUmlET0ohJVjzM7FEvjfEzZATn4WGVlhc5VRKIMKilDEP6tdAEylrePR4crKa3QzKjS+oEpIYLIPGdHHgYnfDZtuDJOJj4jk9LZUSWiE3vjAzPJzd/YorraBhSrRpfLwaYWGhUKkTWO1GRccyi2bZXdi5803IiS/MjIhAaGgo6/LRsbGUzEjNzkiDlg1maxZLLFo3lJ6IOEuUlJRATnzh+vXrBDPBYjYj9rFVcK5ug/XlvYjPWYlZmtlQuUphmc/+OwI2q/07W3S681k0fM8D/PUEYuasRV51F5zl78BZ2Y3EOeUoeLUXmuc2Iy0mEvh9D+TIF/BpP745348nH58LT20XXDU9MCzdjdSn6+Gp76WEv8SIdzFw8SjkyBdw6ShwYRDrSxfAQwq4q7oRZX8eCscSWFa0wVHRgcGqBfj69H7IkS8cW78IuPMRrg3tIXgXPJTAtKoLcfnl8NTsg5MSFBfYgE8GIEc+i7eKH4MQbYO7kixKh628G6qCariruylBF54zqgL6dGC684X23a2wle3xJSAVjMWbEFdQRZb1Jbh65TPImS+cHB2GZuHrLIEIFUtb6V7OatpFFp344xXImS+cGDkG44s/ZavvoUNMEO0pY8nsFZ24GmCC6c4X3jsxghzaEt00PzgrO9Dk9cK4sJkSdsBe3oU//2kCcuYLp06Owl2znxpcD+v64mNpz3iZRR01BwL++Ha681kCV827cFR2wrPOtx3G5vhq2FN/KOAEUgonuJcx   // Draw background once, snapshot for fast restore
  drawBackground();
  var bgData = ctx.getImageData(0, 0, GW, GH);

  // === ANIMATION ===
  var startTime = null;
  var WALK_MS   = 1000;
  var START_X   = -24;
  var END_X     = -2;
  var CHAR_Y    = 62;
  var walkDone  = false;

  function showBubble() {
    var plain = "I'm giving my portfolio a much needed overhaul. For now, find me on ";
    var link  = 'LinkedIn';
    var full  = plain + link;
    var i     = 0;
    bubble.hidden = false;
    (function type() {
      dialogue.textContent = full.slice(0, ++i);
      if (i < full.length) {
        setTimeout(type, 40);
      } else {
        dialogue.innerHTML = plain +
          '<a href="https://www.linkedin.com/in/craig-wen/">LinkedIn</a>';
      }
    })();
  }

  function animate(ts) {
    if (!startTime) startTime = ts;
    var elapsed = ts - startTime;

    ctx.putImageData(bgData, 0, 0);

    var charX, frame;
    if (elapsed < WALK_MS) {
      var t = elapsed / WALK_MS;
      charX = Math.floor(START_X + (END_X - START_X) * t);
      frame = (Math.floor(elapsed / 130) % 2) + 1;
    } else {
      charX = END_X;
      frame = 0;
      if (!walkDone) {
        walkDone = true;
        showBubble();
      }
    }

    ctx.drawImage(_spr, frame * 24, 0, 24, 64, charX, CHAR_Y - 62, 24, 64);

    if (!walkDone) requestAnimationFrame(animate);
  }

  _spr.onload = function() { requestAnimationFrame(animate); };

})();
</script>
