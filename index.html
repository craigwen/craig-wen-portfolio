<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craig Wen</title>
<meta name="description" content="Craig Wen — Content Designer. Portfolio coming soon.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0820;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    -webkit-font-smoothing: antialiased;
  }

  .canvas-wrap {
    position: relative;
    flex-shrink: 0;
  }

  #scene {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #bubble {
    position: absolute;
    left: 7%;
    top: 4%;
    max-width: 55%;
    background: #fef0d9;
    border: 3px solid #1a0d05;
    padding: 0.6em 0.9em;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(0.45rem, 1.1vw, 0.7rem);
    line-height: 2.2;
    color: #1a0d05;
  }

  #bubble::after {
    content: '';
    position: absolute;
    bottom: -11px; left: 16px;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 11px solid #1a0d05;
  }

  #bubble::before {
    content: '';
    position: absolute;
    bottom: -6px; left: 19px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid #fef0d9;
    z-index: 1;
  }

  #bubble a { color: #ff7733; text-decoration: none; }
  #bubble a:hover { text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>

<div class="canvas-wrap">
  <canvas id="scene" aria-label="Pixel art scene: a construction site at sunset, with a pixel character, traffic cones, a sawhorse barrier, and a road"></canvas>
  <div id="bubble" hidden>
    <p id="dialogue"></p>
  </div>
</div>

<script>
(function () {
  var canvas   = document.getElementById('scene');
  var ctx      = canvas.getContext('2d');
  var bubble   = document.getElementById('bubble');
  var dialogue = document.getElementById('dialogue');

  var GW = 96, GH = 40;
  canvas.width  = GW;
  canvas.height = GH;

  function px(x, y, c, w, h) {
    w = w === undefined ? 1 : w;
    h = h === undefined ? 1 : h;
    if (x >= GW || y >= GH || x + w <= 0 || y + h <= 0) return;
    ctx.fillStyle = c;
    ctx.fillRect(x, y, Math.min(w, GW - x), Math.min(h, GH - y));
  }

  function lerpColor(c0, c1, t) {
    function hex(s) { return [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)]; }
    var a = hex(c0), b = hex(c1);
    return 'rgb('+~~(a[0]+(b[0]-a[0])*t)+','+~~(a[1]+(b[1]-a[1])*t)+','+~~(a[2]+(b[2]-a[2])*t)+')';
  }

  var skyStops = [
    [0,  '#0d0820'],
    [7,  '#1a1040'],
    [13, '#3a1250'],
    [18, '#6a1f45'],
    [22, '#9b3030'],
    [26, '#d05025'],
    [29, '#ff7733'],
  ];

  function skyAt(row) {
    for (var i = 0; i < skyStops.length - 1; i++) {
      var r0 = skyStops[i][0], c0 = skyStops[i][1];
      var r1 = skyStops[i+1][0], c1 = skyStops[i+1][1];
      if (row >= r0 && row < r1) return lerpColor(c0, c1, (row - r0) / (r1 - r0));
    }
    return skyStops[skyStops.length - 1][1];
  }

  function drawCone(cx, cy) {
    px(cx+3, cy,   '#ffaa77', 1);
    px(cx+3, cy+1, '#ff9966', 1);
    px(cx+2, cy+2, '#ffe8d8', 3);
    px(cx+1, cy+3, '#ffaa77', 1); px(cx+2, cy+3, '#ff7733', 3); px(cx+5, cy+3, '#cc5520', 1);
    px(cx+1, cy+4, '#ffaa77', 1); px(cx+2, cy+4, '#ff7733', 3); px(cx+5, cy+4, '#cc5520', 1);
    px(cx+1, cy+5, '#ffe8d8', 5);
    px(cx,   cy+6, '#ffaa77', 1); px(cx+1, cy+6, '#ff7733', 5); px(cx+6, cy+6, '#cc5520', 1);
    px(cx,   cy+7, '#ffaa77', 1); px(cx+1, cy+7, '#ff7733', 5); px(cx+6, cy+7, '#cc5520', 1);
    px(cx,   cy+8, '#ffe8d8', 7);
    px(cx,   cy+9, '#ffaa77', 1); px(cx+1, cy+9, '#ff7733', 5); px(cx+6, cy+9, '#cc5520', 1);
    px(cx-1, cy+10, '#5a3015', 9, 2);
  }

  function drawBackground() {
    // Sky
    for (var y = 0; y < 30; y++) px(0, y, skyAt(y), GW);

    // Ground
    var ground = ['#3d2010','#2d1508','#2d1508','#251205','#221004','#1e0d04','#1a0d05','#170b03','#140903','#120802'];
    for (var yg = 30; yg < GH; yg++) px(0, yg, ground[yg - 30] || '#120802', GW);

    // Stars
    [
      [3,2],[9,4],[14,1],[16,2],[24,1],[32,4],[41,2],[50,1],[58,3],[66,2],[74,4],[83,1],[93,3],
      [2,8],[7,6],[12,10],[17,7],[25,6],[33,9],[40,8],[48,10],[56,8],[63,11],[71,9],[80,7],[88,8],
      [4,14],[10,12],[15,16],[20,14],[28,12],[37,15],[45,13],[53,16],[61,13],[70,16],[78,14],[87,11],[94,13],
      [1,20],[8,22],[13,19],[19,21],[27,19],[35,22],[44,20],[52,23],[61,21],[69,19],[78,22],[86,20]
    ].forEach(function(s) { px(s[0], s[1], '#e0d0f8'); });
    [[9,4],[32,4],[50,1],[56,8],[44,20]].forEach(function(s) { px(s[0], s[1], '#ffffff'); });

    // Moon
    px(90, 1, '#fff4b0', 3, 3);

    // Barrier
    px(22, 22, '#8b6040', 52, 1);
    for (var bx = 22; bx < 74; bx++) {
      for (var by = 23; by <= 27; by++) {
        px(bx, by, Math.floor((bx + by) / 5) % 2 === 0 ? '#ffe066' : '#1a0d05');
      }
    }
    px(22, 28, '#8b6040', 52, 1);
    px(25, 29, '#8b6040', 2, 4);
    px(23, 32, '#8b6040', 6, 1);
    px(46, 29, '#8b6040', 2, 3);
    px(68, 29, '#8b6040', 2, 4);
    px(66, 32, '#8b6040', 6, 1);

    // Cones
    drawCone(14, 20);
    drawCone(78, 20);

    // Road dashes
    for (var dx = 0; dx < GW; dx += 9) px(dx, 31, '#4a2e10', 5, 1);
  }

  // === CHARACTER (Craig) ===
  var HAIR  = '#1a0d05';
  var SKIN  = '#f0b87a';
  var SHIRT = '#3d5a7a';
  var PANTS = '#2a3a4a';
  var SHOE  = '#1a0d05';

  function drawCharacter(cx, baseY, frame) {
    px(cx+1, baseY-9, HAIR,  2);      // hair top
    px(cx,   baseY-8, HAIR,  4);      // hair
    px(cx,   baseY-7, SKIN,  4);      // face
    px(cx+1, baseY-6, SKIN,  2);      // neck
    px(cx,   baseY-5, SHIRT, 4);      // shirt
    px(cx,   baseY-4, SHIRT, 4);
    px(cx,   baseY-3, HAIR,  4);      // belt
    px(cx,   baseY-2, PANTS, 4);      // pants
    px(cx,   baseY-1, PANTS, 4);
    // feet
    if (frame === 0) {
      px(cx,   baseY, SHOE, 2);       // standing: feet together
      px(cx+2, baseY, SHOE, 2);
    } else if (frame === 1) {
      px(cx-1, baseY, SHOE, 2);       // walk A: left foot forward
      px(cx+2, baseY, SHOE, 2);
    } else {
      px(cx,   baseY, SHOE, 2);       // walk B: right foot forward
      px(cx+3, baseY, SHOE, 2);
    }
  }

  // Draw background once, snapshot for fast restore
  drawBackground();
  var bgData = ctx.getImageData(0, 0, GW, GH);

  // === ANIMATION ===
  var startTime = null;
  var WALK_MS   = 1000;
  var START_X   = -5;
  var END_X     = 8;
  var CHAR_Y    = 29;
  var walkDone  = false;

  function showBubble() {
    var plain = "I'm giving my portfolio a much needed overhaul. For now, find me on ";
    var link  = 'LinkedIn';
    var full  = plain + link;
    var i     = 0;
    bubble.hidden = false;
    (function type() {
      dialogue.textContent = full.slice(0, ++i);
      if (i < full.length) {
        setTimeout(type, 40);
      } else {
        dialogue.innerHTML = plain +
          '<a href="https://www.linkedin.com/in/craig-wen/">LinkedIn</a>';
      }
    })();
  }

  function animate(ts) {
    if (!startTime) startTime = ts;
    var elapsed = ts - startTime;

    ctx.putImageData(bgData, 0, 0);

    var charX, frame;
    if (elapsed < WALK_MS) {
      var t = elapsed / WALK_MS;
      charX = Math.floor(START_X + (END_X - START_X) * t);
      frame = (Math.floor(elapsed / 130) % 2) + 1;
    } else {
      charX = END_X;
      frame = 0;
      if (!walkDone) {
        walkDone = true;
        showBubble();
      }
    }

    drawCharacter(charX, CHAR_Y, frame);

    if (!walkDone) requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);

})();
</script>

</body>
</html>
